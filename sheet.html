<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORBITAL // Fiche de personnage</title>

<style>
:root {
    --bg: #050911;
    --bg2: #09121e;
    --panel: #0b1624;
    --panel2: #0e1d2d;
    --cyan: #00e5ff;
    --blue: #4ca6ff;
    --green: #62ff9b;
    --yellow: #ffd166;
    --red: #ff5577;
    --text: #d9edf5;
    --muted: #76909e;
    --border: rgba(0,229,255,.28);
    --border-soft: rgba(255,255,255,.08);
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background:
        linear-gradient(rgba(0,229,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,.025) 1px, transparent 1px),
        radial-gradient(circle at 50% 0%, #102238 0%, var(--bg) 55%);
    background-size: 32px 32px, 32px 32px, auto;
    color: var(--text);
    font-family: "Courier New", Consolas, monospace;
    min-height: 100vh;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

.app {
    max-width: 1500px;
    margin: 0 auto;
    padding: 20px;
}

/* =========================================================
   HEADER
========================================================= */

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 20px;
    padding: 18px 20px;
    border: 1px solid var(--border);
    background: rgba(5,12,22,.88);
    box-shadow: 0 0 25px rgba(0,229,255,.08);
}

.logo {
    color: var(--cyan);
    font-size: 1.4rem;
    font-weight: bold;
    letter-spacing: .15em;
}

.subtitle {
    color: var(--muted);
    font-size: .72rem;
    margin-top: 5px;
}

.top-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.btn {
    border: 1px solid var(--cyan);
    background: rgba(0,229,255,.08);
    color: var(--cyan);
    padding: 10px 15px;
    border-radius: 4px;
    transition: .15s;
}

.btn:hover {
    background: rgba(0,229,255,.18);
    box-shadow: 0 0 15px rgba(0,229,255,.18);
}

.btn.primary {
    background: var(--cyan);
    color: #001017;
    font-weight: bold;
}

.btn.secondary {
    border-color: var(--blue);
    color: var(--blue);
}

.btn.danger {
    border-color: var(--red);
    color: var(--red);
}

.btn:disabled {
    opacity: .35;
    cursor: not-allowed;
    box-shadow: none;
}

/* =========================================================
   PANELS
========================================================= */

.panel {
    background: rgba(8,18,30,.92);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 18px;
    box-shadow:
        0 0 25px rgba(0,229,255,.04),
        inset 0 0 30px rgba(0,229,255,.02);
}

.panel-title {
    color: var(--cyan);
    font-size: .85rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border-soft);
    padding-bottom: 10px;
    margin-bottom: 15px;
}

.grid {
    display: grid;
    gap: 15px;
}

.grid-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
}

.grid-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
}

.grid-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
}

.field {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.field label {
    color: var(--muted);
    font-size: .72rem;
    text-transform: uppercase;
}

input,
textarea,
select {
    width: 100%;
    background: #050b13;
    color: var(--text);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 4px;
    padding: 9px;
    outline: none;
}

input:focus,
textarea:focus,
select:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 8px rgba(0,229,255,.14);
}

textarea {
    min-height: 110px;
    resize: vertical;
}

/* =========================================================
   CHARACTER SHEET
========================================================= */

.sheet-header {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 20px;
    margin-bottom: 15px;
}

.character-name {
    font-size: 1.8rem;
    color: white;
    letter-spacing: .06em;
}

.character-meta {
    color: var(--muted);
    margin-top: 7px;
    font-size: .8rem;
}

.status-badge {
    display: inline-block;
    padding: 5px 8px;
    border: 1px solid var(--green);
    color: var(--green);
    font-size: .65rem;
    margin-top: 8px;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 8px;
}

.stat-card {
    border: 1px solid var(--border-soft);
    background: rgba(255,255,255,.025);
    padding: 10px;
    text-align: center;
}

.stat-name {
    color: var(--muted);
    font-size: .65rem;
    margin-bottom: 4px;
}

.stat-value {
    font-size: 1.4rem;
    color: white;
    font-weight: bold;
}

.stat-derived {
    font-size: .68rem;
    color: var(--muted);
    margin-top: 5px;
}

.derived-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0,1fr));
    gap: 8px;
}

.derived-card {
    padding: 12px;
    border: 1px solid var(--border-soft);
    background: rgba(0,229,255,.025);
}

.derived-label {
    color: var(--muted);
    font-size: .65rem;
    text-transform: uppercase;
}

.derived-value {
    color: var(--cyan);
    font-size: 1.15rem;
    font-weight: bold;
    margin-top: 5px;
}

/* =========================================================
   SKILLS
========================================================= */

.skills-table {
    width: 100%;
}

.skill-row {
    display: grid;
    grid-template-columns:
        minmax(190px, 1fr)
        65px
        75px
        60px
        60px
        75px
        75px;
    gap: 7px;
    align-items: center;
    padding: 8px 9px;
    margin-bottom: 4px;
    border: 1px solid rgba(255,255,255,.07);
    background: rgba(255,255,255,.02);
    border-radius: 4px;
}

.skill-row.job-skill {
    border-color: rgba(0,229,255,.42);
    background: rgba(0,229,255,.055);
}

.skill-header {
    background: rgba(0,229,255,.08);
    color: var(--cyan);
    text-transform: uppercase;
    font-size: .65rem;
}

.skill-name {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
}

.skill-name-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.job-badge {
    flex-shrink: 0;
    padding: 2px 5px;
    border: 1px solid var(--cyan);
    color: var(--cyan);
    font-size: .55rem;
    border-radius: 3px;
}

.skill-value {
    text-align: center;
    font-family: "Courier New", monospace;
}

.skill-base {
    color: var(--muted);
}

.skill-final {
    color: var(--green);
    font-weight: bold;
    font-size: 1.02rem;
}

.skill-derived {
    color: var(--muted);
    font-size: .78rem;
}

.skill-input {
    padding: 6px;
    text-align: center;
}

/* =========================================================
   CREATOR
========================================================= */

.modal {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,.78);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.creator {
    width: min(1250px, 100%);
    max-height: 94vh;
    display: flex;
    flex-direction: column;
    background: #07101b;
    border: 1px solid var(--cyan);
    box-shadow: 0 0 50px rgba(0,229,255,.15);
    overflow: hidden;
}

.creator-header {
    padding: 15px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.creator-title {
    color: var(--cyan);
    font-size: 1rem;
    letter-spacing: .12em;
}

.steps {
    display: flex;
    overflow-x: auto;
    border-bottom: 1px solid var(--border-soft);
}

.step-tab {
    flex: 1;
    min-width: 120px;
    padding: 11px 8px;
    text-align: center;
    color: var(--muted);
    border-right: 1px solid var(--border-soft);
    font-size: .68rem;
}

.step-tab.active {
    color: var(--cyan);
    background: rgba(0,229,255,.07);
}

.creator-body {
    overflow-y: auto;
    padding: 20px;
    flex: 1;
}

.creator-footer {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

/* =========================================================
   POINT BUY
========================================================= */

.point-summary {
    position: sticky;
    top: 0;
    z-index: 10;
    padding: 12px;
    margin-bottom: 15px;
    background: rgba(7,16,27,.96);
    border: 1px solid var(--cyan);
    display: flex;
    justify-content: space-between;
    gap: 20px;
}

.points-good {
    color: var(--green);
}

.points-bad {
    color: var(--red);
}

.stat-editor {
    border: 1px solid var(--border-soft);
    padding: 12px;
    background: rgba(255,255,255,.02);
}

.stat-editor-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}

.stat-code {
    color: var(--cyan);
    font-weight: bold;
}

.stat-editor-value {
    color: white;
    font-weight: bold;
}

.range {
    width: 100%;
    accent-color: var(--cyan);
}

.number-row {
    display: grid;
    grid-template-columns: 1fr 80px;
    gap: 10px;
    align-items: center;
    margin-top: 8px;
}

.number-input {
    text-align: center;
}

/* =========================================================
   AGE
========================================================= */

.age-selector {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 8px;
    margin-bottom: 15px;
}

.age-option {
    padding: 12px 8px;
    border: 1px solid var(--border-soft);
    background: rgba(255,255,255,.02);
    color: var(--muted);
    cursor: pointer;
    text-align: center;
}

.age-option.active {
    color: var(--cyan);
    border-color: var(--cyan);
    background: rgba(0,229,255,.08);
}

.penalty-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 10px;
}

.penalty-summary {
    padding: 10px;
    border: 1px solid var(--border-soft);
    margin-bottom: 12px;
}

.roll-box {
    border: 1px solid var(--border-soft);
    padding: 15px;
    background: rgba(255,255,255,.02);
}

.roll-result {
    margin-top: 10px;
    color: var(--green);
    line-height: 1.6;
}

/* =========================================================
   OCCUPATION
========================================================= */

.job-card {
    margin-top: 15px;
    border: 1px solid var(--cyan);
    background: rgba(0,229,255,.035);
    padding: 15px;
}

.job-skills-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
}

.job-skill-chip {
    padding: 5px 7px;
    border: 1px solid rgba(0,229,255,.3);
    color: var(--cyan);
    font-size: .65rem;
}

/* =========================================================
   SKILLS CREATOR + STICKY CREDITS
========================================================= */

.skills-layout {
    display: grid;
    grid-template-columns: 240px minmax(0,1fr);
    gap: 20px;
    align-items: start;
}

.skills-credits-sticky {
    position: sticky;
    top: 0;
    z-index: 20;
    align-self: start;
}

.credits-card {
    background: rgba(8,18,30,.97);
    border: 1px solid var(--cyan);
    box-shadow:
        0 0 18px rgba(0,229,255,.15),
        inset 0 0 20px rgba(0,229,255,.04);
    padding: 16px;
    border-radius: 6px;
}

.credits-title {
    color: var(--cyan);
    font-size: .72rem;
    font-weight: bold;
    letter-spacing: .12em;
    margin-bottom: 14px;
}

.credit-line,
.credit-total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
}

.credit-line {
    border-bottom: 1px solid rgba(255,255,255,.08);
}

.credit-line strong,
.credit-total strong {
    color: white;
    min-width: 45px;
    text-align: right;
}

.credit-total {
    margin-top: 6px;
    color: var(--cyan);
    font-weight: bold;
}

.credit-warning {
    color: var(--red) !important;
}

/* =========================================================
   PROFILE
========================================================= */

.profile-section {
    margin-top: 15px;
}

.profile-field.empty-field {
    border-color: var(--red) !important;
    box-shadow: 0 0 8px rgba(255,85,119,.12);
}

.required-mark {
    color: var(--red);
}

/* =========================================================
   EQUIPMENT
========================================================= */

.equipment-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.equipment-row {
    display: grid;
    grid-template-columns: 35px 1fr 70px;
    gap: 7px;
    align-items: center;
}

.pencil {
    padding: 8px;
    border: 1px solid var(--border-soft);
    background: transparent;
    color: var(--cyan);
}

.equipment-quantity {
    text-align: center;
}

.equipment-source {
    color: var(--muted);
    font-size: .68rem;
    margin-top: 8px;
}

/* =========================================================
   EQUIPMENT MODAL
========================================================= */

.item-picker {
    width: min(700px,100%);
    max-height: 85vh;
    background: #07101b;
    border: 1px solid var(--cyan);
    display: flex;
    flex-direction: column;
}

.item-picker-body {
    overflow-y: auto;
    padding: 15px;
}

.item-card {
    padding: 12px;
    margin-bottom: 7px;
    border: 1px solid var(--border-soft);
    cursor: pointer;
}

.item-card:hover {
    border-color: var(--cyan);
    background: rgba(0,229,255,.05);
}

.item-card-name {
    color: var(--cyan);
}

.item-card-category {
    color: var(--muted);
    font-size: .65rem;
    margin-top: 3px;
}

.item-card-description {
    font-size: .72rem;
    margin-top: 7px;
    color: #b8cbd4;
}

/* =========================================================
   NOTICES
========================================================= */

.notice {
    padding: 10px;
    border-left: 3px solid var(--cyan);
    background: rgba(0,229,255,.05);
    color: var(--muted);
    font-size: .75rem;
    margin-bottom: 15px;
}

.notice.error {
    border-color: var(--red);
    color: #ffb0bf;
}

.notice.success {
    border-color: var(--green);
    color: #b8ffd0;
}

/* =========================================================
   PRINT SHEET
========================================================= */

.print-sheet {
    display: none;
}

.print-page {
    background: white;
    color: black;
    width: 194mm;
    min-height: 281mm;
    padding: 4mm;
    font-family: Arial, sans-serif;
}

.print-title {
    border-bottom: 2px solid black;
    padding-bottom: 3mm;
    margin-bottom: 3mm;
}

.print-title h1 {
    margin: 0;
    font-size: 17pt;
}

.print-title p {
    margin: 1mm 0 0;
    font-size: 7pt;
}

.print-section {
    border: 1px solid #222;
    margin-bottom: 2.5mm;
    padding: 2mm;
}

.print-section-title {
    font-size: 7pt;
    font-weight: bold;
    text-transform: uppercase;
    border-bottom: 1px solid #999;
    padding-bottom: 1mm;
    margin-bottom: 1.5mm;
}

.print-stats {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 1.5mm;
}

.print-stat {
    border: 1px solid #444;
    text-align: center;
    padding: 1.5mm;
}

.print-stat .name {
    font-size: 5.5pt;
    font-weight: bold;
}

.print-stat .value {
    font-size: 10pt;
    font-weight: bold;
}

.print-stat .sub {
    font-size: 5pt;
    color: #555;
}

.print-derived {
    display: grid;
    grid-template-columns: repeat(6,1fr);
    gap: 1.5mm;
}

.print-derived-item {
    border: 1px solid #555;
    padding: 1.5mm;
    font-size: 6pt;
}

.print-derived-item strong {
    display: block;
    font-size: 9pt;
}

.print-skills {
    columns: 2;
    column-gap: 5mm;
}

.print-skill {
    display: grid;
    grid-template-columns: 1fr 20px 24px 22px 22px;
    gap: 1mm;
    border-bottom: .25mm solid #ddd;
    font-size: 5.5pt;
    padding: .6mm 0;
    break-inside: avoid;
}

.print-skill.job {
    font-weight: bold;
}

.print-profile-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2mm;
}

.print-profile-box {
    min-height: 23mm;
    border: 1px solid #555;
    padding: 2mm;
}

.print-profile-box.full {
    grid-column: 1 / -1;
}

.print-profile-label {
    font-size: 6pt;
    font-weight: bold;
    margin-bottom: 1mm;
}

.print-profile-value {
    font-size: 7pt;
    white-space: pre-wrap;
}

.print-equipment {
    display: grid;
    grid-template-columns: 1fr 15mm;
}

.print-equipment-row {
    min-height: 6mm;
    border-bottom: .25mm solid #888;
    font-size: 6.5pt;
    padding: 1mm;
}

.print-equipment-qty {
    border-bottom: .25mm solid #888;
    text-align: center;
    padding: 1mm;
    font-size: 6.5pt;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 1000px) {
    .stats-grid {
        grid-template-columns: repeat(2,1fr);
    }

    .derived-grid {
        grid-template-columns: repeat(2,1fr);
    }

    .skills-layout {
        grid-template-columns: 1fr;
    }

    .skills-credits-sticky {
        position: sticky;
        top: 0;
    }

    .age-selector {
        grid-template-columns: repeat(2,1fr);
    }
}

@media (max-width: 700px) {
    .app {
        padding: 10px;
    }

    .topbar {
        flex-direction: column;
        align-items: flex-start;
    }

    .grid-2,
    .grid-3,
    .grid-4 {
        grid-template-columns: 1fr;
    }

    .skill-row {
        grid-template-columns:
            minmax(140px,1fr)
            50px
            60px
            50px
            50px
            60px
            60px;
        font-size: .7rem;
    }

    .penalty-grid {
        grid-template-columns: 1fr;
    }
}

/* =========================================================
   PRINT
========================================================= */

@media print {
    @page {
        size: A4 portrait;
        margin: 8mm;
    }

    html,
    body {
        margin: 0 !important;
        padding: 0 !important;
        background: white !important;
        color: black !important;
    }

    body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    .app,
    .modal,
    .screen-only {
        display: none !important;
    }

    .print-sheet {
        display: block !important;
    }

    .print-page {
        display: block !important;
        width: 194mm;
        height: 281mm;
        min-height: 281mm;
        max-height: 281mm;
        overflow: hidden;
        break-after: page;
        page-break-after: always;
    }

    .print-page:last-child {
        break-after: auto;
        page-break-after: auto;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="topbar screen-only">
        <div>
            <div class="logo">ORBITAL // CHARACTER SYSTEM</div>
            <div class="subtitle">
                Système d'aventure science-fiction — édition non paranormale
            </div>
        </div>

        <div class="top-actions">
            <button class="btn primary" id="createCharacterBtn">
                Créer un personnage
            </button>
            <button class="btn secondary" id="printBtn">
                Imprimer
            </button>
        </div>
    </header>

    <main id="characterSheet" class="screen-only">
        <!-- Fiche générée par JavaScript -->
    </main>

</div>


<!-- =========================================================
     CRÉATEUR
========================================================= -->

<div class="modal hidden" id="creatorModal">

    <div class="creator">

        <div class="creator-header">
            <div class="creator-title">
                CRÉATION DU PERSONNAGE
            </div>

            <button class="btn danger" id="closeCreatorBtn">
                Fermer
            </button>
        </div>

        <div class="steps" id="stepTabs">
            <div class="step-tab active" data-step-tab="1">
                1. Caractéristiques
            </div>
            <div class="step-tab" data-step-tab="2">
                2. Âge
            </div>
            <div class="step-tab" data-step-tab="3">
                3. Chance
            </div>
            <div class="step-tab" data-step-tab="4">
                4. Métier
            </div>
            <div class="step-tab" data-step-tab="5">
                5. Compétences
            </div>
            <div class="step-tab" data-step-tab="6">
                6. Validation
            </div>
        </div>

        <div class="creator-body">
            <div id="creatorContent"></div>
        </div>

        <div class="creator-footer">
            <button class="btn secondary" id="previousStepBtn">
                ← Retour
            </button>

            <button class="btn primary" id="nextStepBtn">
                Suivant →
            </button>
        </div>

    </div>

</div>


<!-- =========================================================

/* =========================================================
   OUTILS
========================================================= */

function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
}

function rollDie(sides) {
    return Math.floor(Math.random() * sides) + 1;
}

function rollDice(number, sides) {
    const results = [];

    for (let i = 0; i < number; i++) {
        results.push(rollDie(sides));
    }

    return {
        results,
        total: results.reduce((a,b) => a + b, 0)
    };
}

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function categoryLabel(category) {
    return {
        intellectual: "Intellectuel",
        manual: "Manuel",
        social: "Social"
    }[category] || category;
}


/* =========================================================
   POINT BUY
========================================================= */

function getBaseStatTotal() {
    return Object.values(character.baseStats)
        .reduce((total, value) => total + Number(value || 0), 0);
}

function getRemainingBasePoints() {
    return 460 - getBaseStatTotal();
}

function setBaseStat(stat, value) {
    value = Number(value);

    if (!Number.isFinite(value)) {
        return;
    }

    value = clamp(Math.floor(value), 15, 90);

    character.baseStats[stat] = value;

    recalculateCharacter();
}

function recalculateCharacter() {
    character.stats = calculateAgeModifiedStats();
    character.derived = calculateDerivedStats();

    updateVisibleCreatorValues();
}

function calculateAgeModifiedStats() {
    const stats = {
        ...character.baseStats
    };

    const age = Number(character.age);

    const penalties = character.agePenalties;

    stats.STR -= penalties.STR || 0;
    stats.CON -= penalties.CON || 0;
    stats.DEX -= penalties.DEX || 0;
    stats.SIZ -= penalties.SIZ || 0;

    if (age >= 15 && age <= 19) {
        stats.EDU -= 5;
    }

    if (age >= 40 && age <= 49) {
        stats.APP -= 5;
    }

    if (age >= 50 && age <= 59) {
        stats.APP -= 10;
    }

    if (age >= 60 && age <= 69) {
        stats.APP -= 15;
    }

    if (age >= 70 && age <= 79) {
        stats.APP -= 20;
    }

    if (age >= 80 && age <= 89) {
        stats.APP -= 25;
    }

    if (character.educationRoll?.success) {
        stats.EDU += character.educationRoll.bonus;
    }

    for (const stat of Object.keys(stats)) {
        stats[stat] = Math.max(1, Math.floor(stats[stat]));
    }

    stats.EDU = Math.min(99, stats.EDU);

    return stats;
}


/* =========================================================
   ÂGE
========================================================= */

function getAgePenaltyRequirement(age = character.age) {

    if (age >= 15 && age <= 19) {
        return {
            total: 5,
            stats: ["STR", "SIZ"]
        };
    }

    if (age >= 40 && age <= 49) {
        return {
            total: 5,
            stats: ["STR", "CON", "DEX"]
        };
    }

    if (age >= 50 && age <= 59) {
        return {
            total: 10,
            stats: ["STR", "CON", "DEX"]
        };
    }

    if (age >= 60 && age <= 69) {
        return {
            total: 20,
            stats: ["STR", "CON", "DEX"]
        };
    }

    if (age >= 70 && age <= 79) {
        return {
            total: 40,
            stats: ["STR", "CON", "DEX"]
        };
    }

    if (age >= 80 && age <= 89) {
        return {
            total: 80,
            stats: ["STR", "CON", "DEX"]
        };
    }

    return {
        total: 0,
        stats: []
    };
}

function setAge(age) {
    character.age = clamp(Number(age), 15, 89);

    const requirement = getAgePenaltyRequirement();

    const allowed = requirement.stats;

    for (const stat of ["STR","CON","DEX","SIZ"]) {
        if (!allowed.includes(stat)) {
            character.agePenalties[stat] = 0;
        }
    }

    recalculateCharacter();
}

function setAgePenalty(stat, value) {
    const requirement = getAgePenaltyRequirement();

    if (!requirement.stats.includes(stat)) {
        character.agePenalties[stat] = 0;
        renderCurrentStep();
        return;
    }

    const numeric = Math.max(0, Math.floor(Number(value) || 0));

    const otherSpent = requirement.stats
        .filter(s => s !== stat)
        .reduce(
            (sum, s) => sum + character.agePenalties[s],
            0
        );

    const maxAllowed =
        Math.min(
            character.baseStats[stat] - 1,
            requirement.total - otherSpent
        );

    character.agePenalties[stat] =
        clamp(numeric, 0, Math.max(0, maxAllowed));

    recalculateCharacter();
    renderCurrentStep();
}

function getAgePenaltySpent() {
    const requirement = getAgePenaltyRequirement();

    return requirement.stats.reduce(
        (sum, stat) =>
            sum + Number(character.agePenalties[stat] || 0),
        0
    );
}

function isAgePenaltyValid() {
    const requirement = getAgePenaltyRequirement();

    return getAgePenaltySpent() === requirement.total;
}


/* =========================================================
   ÉDUCATION
========================================================= */

function rollEducation() {

    if (character.educationRollUsed) {
        return;
    }

    character.educationRollUsed = true;

    const currentEdu =
        calculateAgeModifiedStats().EDU;

    const d100 = rollDie(100);

    let success = false;
    let bonus = 0;
    let d10 = null;

    if (d100 > currentEdu) {
        success = true;
        d10 = rollDie(10);
        bonus = d10;
    }

    character.educationRoll = {
        baseEdu: currentEdu,
        d100,
        d10,
        success,
        bonus
    };

    recalculateCharacter();
    renderCurrentStep();
}


/* =========================================================
   CHANCE
========================================================= */

function rollLuck() {

    if (character.luckRollUsed) {
        return;
    }

    character.luckRollUsed = true;

    const dice = rollDice(3, 6);

    character.luck = {
        dice: dice.results,
        total: dice.total * 5
    };

    recalculateCharacter();
    renderCurrentStep();
}


/* =========================================================
   CARACTÉRISTIQUES DÉRIVÉES
========================================================= */

function calculateDamageBuild(str, siz) {

    const total = str + siz;

    if (total <= 64) {
        return {
            damageBonus: "-2",
            build: "-2"
        };
    }

    if (total <= 84) {
        return {
            damageBonus: "-1",
            build: "-1"
        };
    }

    if (total <= 124) {
        return {
            damageBonus: "0",
            build: "0"
        };
    }

    if (total <= 164) {
        return {
            damageBonus: "+1d4",
            build: "+1"
        };
    }

    return {
        damageBonus: "1d6",
        build: "+2"
    };
}

function calculateMovementRate(str, dex, siz, age) {

    let movement;

    if (str > siz && dex > siz) {
        movement = 9;
    }
    else if (str >= siz || dex >= siz) {
        movement = 8;
    }
    else {
        movement = 7;
    }

    if (age >= 40 && age <= 49) movement -= 1;
    if (age >= 50 && age <= 59) movement -= 2;
    if (age >= 60 && age <= 69) movement -= 3;
    if (age >= 70 && age <= 79) movement -= 4;
    if (age >= 80 && age <= 89) movement -= 5;

    return Math.max(1, movement);
}

function calculateDerivedStats() {

    const {
        CON,
        SIZ,
        STR,
        DEX
    } = character.stats;

    const db = calculateDamageBuild(STR, SIZ);

    return {
        hpMax: Math.floor((CON + SIZ) / 10),

        damageBonus: db.damageBonus,

        build: db.build,

        movement: calculateMovementRate(
            STR,
            DEX,
            SIZ,
            character.age
        ),

        dodge: Math.floor(DEX / 2)
    };
}


/* =========================================================
   COMPÉTENCES
========================================================= */

function getSkillBaseValue(key) {

    const skill = SKILLS[key];

    if (!skill) {
        return 0;
    }

    if (typeof skill.base === "number") {
        return skill.base;
    }

    if (skill.base === "EDU") {
        return Math.floor(character.stats.EDU);
    }

    if (skill.base === "APP/2") {
        return Math.floor(character.stats.APP / 2);
    }

    if (skill.base === "DEX/2") {
        return Math.floor(character.stats.DEX / 2);
    }

    return 0;
}

function getSkillAllocation(key) {

    if (!character.skillAllocations[key]) {
        character.skillAllocations[key] = {
            professional: 0,
            personal: 0
        };
    }

    return character.skillAllocations[key];
}

function getSkillFinalValue(key) {

    const base = getSkillBaseValue(key);
    const allocation = getSkillAllocation(key);

    return Math.min(
        99,
        base +
        Number(allocation.professional || 0) +
        Number(allocation.personal || 0)
    );
}

function getProfessionalPool() {

    const job = getSelectedJob();

    if (!job) {
        return 0;
    }

    const {
        EDU,
        STR,
        DEX,
        APP
    } = character.stats;

    switch (job.category) {

        case "intellectual":
            return 4 * EDU;

        case "manual":
            return (
                2 * EDU +
                2 * Math.max(STR, DEX)
            );

        case "social":
            return (
                2 * EDU +
                2 * APP
            );

        default:
            return 0;
    }
}

function getPersonalPool() {
    return character.stats.INT * 2;
}

function getProfessionalSpent() {

    return Object.values(character.skillAllocations)
        .reduce(
            (total, allocation) =>
                total +
                Number(allocation.professional || 0),
            0
        );
}

function getPersonalSpent() {

    return Object.values(character.skillAllocations)
        .reduce(
            (total, allocation) =>
                total +
                Number(allocation.personal || 0),
            0
        );
}

function getProfessionalRemaining() {
    return getProfessionalPool() - getProfessionalSpent();
}

function getPersonalRemaining() {
    return getPersonalPool() - getPersonalSpent();
}

function handleSkillAllocation(event) {

    const input = event.target;

    const key = input.dataset.skill;
    const pool = input.dataset.pool;

    const allocation = getSkillAllocation(key);

    let value = Math.floor(Number(input.value) || 0);

    value = Math.max(0, value);

    const base = getSkillBaseValue(key);

    const otherPool =
        pool === "professional"
            ? allocation.personal
            : allocation.professional;

    const maxBySkill =
        Math.max(
            0,
            99 - base - otherPool
        );

    const available =
        pool === "professional"
            ? getProfessionalRemaining() +
              allocation.professional
            : getPersonalRemaining() +
              allocation.personal;

    value = Math.min(
        value,
        maxBySkill,
        Math.max(0, available)
    );

    allocation[pool] = value;

    input.value = value;

    updateSkillVisual(key);
    updateCreditsDisplay();
}

function updateSkillVisual(key) {

    const finalValue =
        getSkillFinalValue(key);

    const finalElement =
        document.getElementById(
            `skill-final-${key}`
        );

    const halfElement =
        document.getElementById(
            `skill-half-${key}`
        );

    const fifthElement =
        document.getElementById(
            `skill-fifth-${key}`
        );

    if (finalElement) {
        finalElement.textContent = finalValue;
    }

    if (halfElement) {
        halfElement.textContent =
            Math.floor(finalValue / 2);
    }

    if (fifthElement) {
        fifthElement.textContent =
            Math.floor(finalValue / 5);
    }
}

function updateCreditsDisplay() {

    const professional =
        getProfessionalRemaining();

    const personal =
        getPersonalRemaining();

    const total =
        professional + personal;

    const professionalElement =
        document.getElementById(
            "professionalRemaining"
        );

    const personalElement =
        document.getElementById(
            "personalRemaining"
        );

    const totalElement =
        document.getElementById(
            "totalRemaining"
        );

    if (professionalElement) {
        professionalElement.textContent =
            professional;

        professionalElement.classList.toggle(
            "credit-warning",
            professional < 0
        );
    }

    if (personalElement) {
        personalElement.textContent =
            personal;

        personalElement.classList.toggle(
            "credit-warning",
            personal < 0
        );
    }

    if (totalElement) {
        totalElement.textContent =
            total;

        totalElement.classList.toggle(
            "credit-warning",
            total < 0
        );
    }
}

async function loadJobs() {

    try {

        const response =
            await fetch("jobs.json", {
                cache: "no-store"
            });

        if (!response.ok) {
            throw new Error(
                "Impossible de charger jobs.json"
            );
        }

        const data =
            await response.json();

        if (!Array.isArray(data)) {
            throw new Error(
                "Format jobs.json invalide"
            );
        }

        jobs = data;
        jobsLoadedFromJson = true;

    } catch (error) {

        console.warn(error);

        jobs = FALLBACK_JOBS;
        jobsLoadedFromJson = false;
    }

    populateJobSelect();
}

async function loadEquipment() {

    try {

        const response =
            await fetch("equipment.json", {
                cache: "no-store"
            });

        if (!response.ok) {
            throw new Error(
                "Impossible de charger equipment.json"
            );
        }

        const data =
            await response.json();

        if (!Array.isArray(data)) {
            throw new Error(
                "Format equipment.json invalide"
            );
        }

        equipmentItems = data;
        equipmentLoadedFromJson = true;

    } catch (error) {

        console.warn(error);

        equipmentItems = FALLBACK_EQUIPMENT;
        equipmentLoadedFromJson = false;
    }
}

function populateJobSelect() {

    const select =
        document.getElementById("occupationSelect");

    if (!select) {
        return;
    }

    const previous =
        character.occupationId;

    select.innerHTML = `
        <option value="">
            — Sélectionner un métier —
        </option>
        ${
            jobs.map(job => `
                <option value="${escapeHtml(job.id)}">
                    ${escapeHtml(job.name)}
                </option>
            `).join("")
        }
    `;

    select.value = previous;
}

function getSelectedJob() {

    return jobs.find(
        job => job.id === character.occupationId
    ) || null;
}

function selectOccupation(id) {

    if (id === character.occupationId) {
        return;
    }

    character.occupationId = id;

    /*
     * Les points personnels restent conservés.
     * Les points professionnels sont réinitialisés,
     * car ils dépendent du métier sélectionné.
     */
    for (const allocation of Object.values(
        character.skillAllocations
    )) {
        allocation.professional = 0;
    }

    renderCurrentStep();
}


/* =========================================================
   ÉQUIPEMENT
========================================================= */

function addEquipmentItem(item) {

    let index =
        character.equipment.findIndex(
            entry => !entry.name.trim()
        );

    if (index === -1) {
        character.equipment.push({
            name: "",
            quantity: "",
            itemId: ""
        });

        index =
            character.equipment.length - 1;
    }

    character.equipment[index] = {
        name: item.name,
        quantity: "1",
        itemId: item.id
    };

    renderCharacterSheet();
    renderPrintSheet();
}

function updateEquipment(index, field, value) {

    if (!character.equipment[index]) {
        return;
    }

    character.equipment[index][field] =
        value;

    renderPrintSheet();
}

function openEquipmentPicker() {

    const modal =
        document.getElementById(
            "equipmentModal"
        );

    const list =
        document.getElementById(
            "equipmentPickerList"
        );

    list.innerHTML = equipmentItems.map(
        item => `
            <div
                class="item-card"
                data-item-id="${escapeHtml(item.id)}"
            >
                <div class="item-card-name">
                    ${escapeHtml(item.name)}
                </div>

                <div class="item-card-category">
                    ${escapeHtml(item.category || "")}
                </div>

                <div class="item-card-description">
                    ${escapeHtml(item.description || "")}
                </div>
            </div>
        `
    ).join("");

    list.querySelectorAll(".item-card")
        .forEach(card => {

            card.addEventListener(
                "click",
                () => {

                    const item =
                        equipmentItems.find(
                            entry =>
                                entry.id ===
                                card.dataset.itemId
                        );

                    if (item) {
                        addEquipmentItem(item);
                    }

                    modal.classList.add("hidden");
                }
            );
        });

    modal.classList.remove("hidden");
}


/* =========================================================
   PROFIL
========================================================= */

function updateProfile(field, value) {

    character.profile[field] =
        value;

    renderPrintSheet();
}

function profileField(
    label,
    field,
    multiline = false,
    required = true
) {

    const value =
        character.profile[field] || "";

    const emptyClass =
        required && !value.trim()
            ? "empty-field"
            : "";

    if (multiline) {

        return `
            <div class="field">
                <label>
                    ${escapeHtml(label)}
                    ${
                        required
                            ? '<span class="required-mark"> *</span>'
                            : ""
                    }
                </label>

                <textarea
                    class="profile-field ${emptyClass}"
                    data-profile-field="${field}"
                    placeholder="À compléter..."
                >${escapeHtml(value)}</textarea>
            </div>
        `;
    }

    return `
        <div class="field">
            <label>
                ${escapeHtml(label)}
                ${
                    required
                        ? '<span class="required-mark"> *</span>'
                        : ""
                }
            </label>

            <input
                class="profile-field ${emptyClass}"
                data-profile-field="${field}"
                value="${escapeHtml(value)}"
                placeholder="À compléter..."
            >
        </div>
    `;
}

function validationLine(label, valid) {

    `;
}


/* =========================================================
   RENDU CRÉATEUR
========================================================= */

function renderCurrentStep() {

    recalculateCharacter();

    const container =
        document.getElementById(
            "creatorContent"
        );

    if (!container) {
        return;
    }

    switch (currentStep) {

        case 1:
            container.innerHTML =
                renderStep1();
            break;

        case 2:
            container.innerHTML =
                renderStep2();
            break;

        case 3:
            container.innerHTML =
                renderStep3();
            break;

        case 4:
            container.innerHTML =
                renderStep4();
            break;

        case 5:
            container.innerHTML =
                renderStep5();
            break;

        case 6:
            container.innerHTML =
                renderStep6();
            break;
    }

    bindCurrentStepEvents();

    updateStepTabs();

    updateCreatorNavigation();
}

function bindCurrentStepEvents() {

    if (currentStep === 1) {

        document
            .querySelectorAll(
                "[data-stat]"
            )
            .forEach(input => {

                input.addEventListener(
                    "input",
                    event => {

                        const stat =
                            event.target.dataset.stat;

                        setBaseStat(
                            stat,
                            event.target.value
                        );

                        const slider =
                            document.getElementById(
                                `stat-slider-${stat}`
                            );

                        const number =
                            document.getElementById(
                                `stat-input-${stat}`
                            );

                        const value =
                            character.baseStats[stat];

                        if (slider) {
                            slider.value = value;
                        }

                        if (number) {
                            number.value = value;
                        }

                        const label =
                            document.getElementById(
                                `stat-value-${stat}`
                            );

                        if (label) {
                            label.textContent =
                                value;
                        }

                        updatePointSummary();
                    }
                );
            });
    }


    if (currentStep === 2) {

        const ageInput =
            document.getElementById(
                "ageInput"
            );

        if (ageInput) {

            ageInput.addEventListener(
                "input",
                event => {

                    setAge(
                        event.target.value
                    );

                    renderCurrentStep();
                }
            );
        }

        document
            .querySelectorAll("[data-age]")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        const range =
                            button.dataset.age
                                .split("-")
                                .map(Number);

                        const current =
                            character.age;

                        const age =
                            current >= range[0] &&
                            current <= range[1]
                                ? current
                                : range[0];

                        setAge(age);

                        renderCurrentStep();
                    }
                );
            });

        document
            .querySelectorAll(
                "[data-age-penalty]"
            )
            .forEach(input => {

                input.addEventListener(
                    "input",
                    event => {

                        setAgePenalty(
                            event.target.dataset.agePenalty,
                            event.target.value
                        );
                    }
                );
            });

        const educationButton =
            document.getElementById(
                "educationRollBtn"
            );

        if (educationButton) {

            educationButton.addEventListener(
                "click",
                rollEducation
            );
        }
    }


    if (currentStep === 3) {

        const luckButton =
            document.getElementById(
                "luckRollBtn"
            );

        if (luckButton) {
            luckButton.addEventListener(
                "click",
                rollLuck
            );
        }
    }


    if (currentStep === 4) {

        const select =
            document.getElementById(
                "occupationSelect"
            );

        if (select) {

            select.addEventListener(
                "change",
                event => {

                    selectOccupation(
                        event.target.value
                    );
                }
            );
        }
    }


    if (currentStep === 5) {

        document
            .querySelectorAll(".skill-input")
            .forEach(input => {

                input.addEventListener(
                    "input",
                    handleSkillAllocation
                );
            });

        updateCreditsDisplay();
    }


    if (currentStep === 6) {

        const finishButton =
            document.getElementById(
                "finishCharacterBtn"
            );

        if (finishButton) {

            finishButton.addEventListener(
                "click",
                finishCharacter
            );
        }
    }
}

function updatePointSummary() {

    const summary =
        document.querySelector(
            ".point-summary"
        );

    if (!summary) {
        return;
    }

    const total =
        getBaseStatTotal();

    const remaining =
        460 - total;

    summary.innerHTML = `
        <div>
            Points utilisés :
            <strong>${total}</strong> / 460
        </div>

        <div class="${
            remaining === 0
                ? "points-good"
                : "points-bad"
        }">
            ${
                remaining >= 0
                    ? `Points disponibles : ${remaining}`
                    : `Dépassement : ${Math.abs(remaining)}`
            }
        </div>
    `;
}

function updateVisibleCreatorValues() {

    if (currentStep !== 5) {
        return;
    }

    updateCreditsDisplay();
}

function updateStepTabs() {

    document
        .querySelectorAll(
            "[data-step-tab]"
        )
        .forEach(tab => {

            tab.classList.toggle(
                "active",
                Number(tab.dataset.stepTab) ===
                    currentStep
            );
        });
}

function updateCreatorNavigation() {

    const previous =
        document.getElementById(
            "previousStepBtn"
        );

    const next =
        document.getElementById(
            "nextStepBtn"
        );

    previous.disabled =
        currentStep === 1;

    if (currentStep === 6) {

        next.textContent =
            "Terminer";

        next.disabled = true;

    } else {

        next.textContent =
            "Suivant →";

        next.disabled =
            !canLeaveCurrentStep();
    }
}

function canLeaveCurrentStep() {

    if (currentStep === 1) {
        return getBaseStatTotal() === 460;
    }

    if (currentStep === 2) {
        return isAgePenaltyValid();
    }

    if (currentStep === 3) {
        return (
            character.educationRollUsed &&
            character.luckRollUsed
        );
    }

    if (currentStep === 4) {
        return !!getSelectedJob();
    }

    if (currentStep === 5) {
        return (
            getProfessionalRemaining() >= 0 &&
            getPersonalRemaining() >= 0
        );
    }

    return true;
}


/* =========================================================
   NAVIGATION
========================================================= */

function nextStep() {

    if (!canLeaveCurrentStep()) {
        renderCurrentStep();
        return;
    }

    if (currentStep < 6) {
        currentStep++;
        renderCurrentStep();
    }
}

function previousStep() {

    if (currentStep > 1) {
        currentStep--;
        renderCurrentStep();
    }
}

function openCreator() {

    document
        .getElementById("creatorModal")
        .classList.remove("hidden");

    currentStep = 1;

    populateJobSelect();

    renderCurrentStep();
}

function closeCreator() {

    document
        .getElementById("creatorModal")
        .classList.add("hidden");
}

function resetCharacter() {

    character =
        createDefaultCharacter();

    currentStep = 1;
}


/* =========================================================
   GÉNÉRATION
========================================================= */

function finishCharacter() {

    if (!canFinishCharacter()) {
        renderCurrentStep();
        return;
    }

    document
        .getElementById("creatorModal")
        .classList.add("hidden");

    renderCharacterSheet();
    renderPrintSheet();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

function canFinishCharacter() {

    return (
        getBaseStatTotal() === 460 &&
        isAgePenaltyValid() &&
        character.educationRollUsed &&
        character.luckRollUsed &&
        !!getSelectedJob() &&
        getProfessionalRemaining() >= 0 &&
        getPersonalRemaining() >= 0
    );
}

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        recalculateCharacter();

        renderCharacterSheet();
        renderPrintSheet();

        await Promise.all([
            loadJobs(),
            loadEquipment()
        ]);

        document
            .getElementById(
                "createCharacterBtn"
            )
            .addEventListener(
                "click",
                () => {

                    const hasCharacter =
                        character.profile.name ||
                        character.occupationId ||
                        character.luckRollUsed ||
                        character.educationRollUsed;

                    if (hasCharacter) {

                        const confirmReset =
                            confirm(
                                "Créer un nouveau personnage ? " +
                                "Le personnage actuel sera réinitialisé."
                            );

                        if (!confirmReset) {
                            openCreator();
                            return;
                        }

                        resetCharacter();
                    }

                    openCreator();
                }
            );


        document
            .getElementById(
                "printBtn"
            )
            .addEventListener(
                "click",
                () => {

                    renderPrintSheet();

                    window.print();
                }
            );


        document
            .getElementById(
                "closeCreatorBtn"
            )
            .addEventListener(
                "click",
                closeCreator
            );


        document
            .getElementById(
                "previousStepBtn"
            )
            .addEventListener(
                "click",
                previousStep
            );


        document
            .getElementById(
                "nextStepBtn"
            )
            .addEventListener(
                "click",
                nextStep
            );


        document
            .getElementById(
                "closeEquipmentBtn"
            )
            .addEventListener(
                "click",
                () => {

                    document
                        .getElementById(
                            "equipmentModal"
                        )
                        .classList.add(
                            "hidden"
                        );
                }
            );


        document
            .querySelectorAll(
                "[data-step-tab]"
            )
            .forEach(tab => {

                tab.addEventListener(
                    "click",
                    () => {

                        const target =
                            Number(
                                tab.dataset.stepTab
                            );

                        if (
                            target < currentStep ||
                            canLeaveCurrentStep()
                        ) {
                            currentStep =
                                target;

                            renderCurrentStep();
                        }
                    }
                );
            });
    }
);
</script>

</body>
</html>
