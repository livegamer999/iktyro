<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXPLORER — Fiche de personnage</title>

<style>
:root {
    --bg: #050910;
    --panel: #0b121c;
    --panel2: #101b28;
    --border: #1b6680;
    --cyan: #35d9ff;
    --cyan-soft: #74eaff;
    --green: #58f5ae;
    --yellow: #ffd65a;
    --red: #ff5964;
    --text: #e5f6ff;
    --muted: #7893a2;
    --shadow: 0 0 25px rgba(53,217,255,.08);
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background:
        linear-gradient(rgba(53,217,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(53,217,255,.025) 1px, transparent 1px),
        radial-gradient(circle at 50% 0%, #102438 0%, var(--bg) 55%);
    background-size: 32px 32px, 32px 32px, 100% 100%;
    color: var(--text);
    font-family: "Courier New", monospace;
    min-height: 100vh;
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    width: min(1450px, 96%);
    margin: auto;
    padding: 20px 0 60px;
}

/* --------------------------------------------------
   HEADER
-------------------------------------------------- */

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    padding: 18px 22px;
    margin-bottom: 20px;
    border: 1px solid var(--border);
    background: rgba(5,12,20,.9);
    box-shadow: var(--shadow);
}

.logo {
    color: var(--cyan);
    font-size: 1.5rem;
    font-weight: bold;
    letter-spacing: .15em;
}

.subtitle {
    color: var(--muted);
    font-size: .75rem;
    margin-top: 4px;
}

.toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

/* --------------------------------------------------
   BUTTONS
-------------------------------------------------- */

.btn {
    border: 1px solid var(--cyan);
    background: rgba(53,217,255,.08);
    color: var(--cyan-soft);
    padding: 9px 14px;
    transition: .15s;
}

.btn:hover {
    background: rgba(53,217,255,.18);
    box-shadow: 0 0 12px rgba(53,217,255,.18);
}

.btn.primary {
    background: var(--cyan);
    color: #001018;
    font-weight: bold;
}

.btn.green {
    border-color: var(--green);
    color: var(--green);
}

.btn.danger {
    border-color: var(--red);
    color: var(--red);
}

.btn:disabled {
    opacity: .35;
    cursor: not-allowed;
}

/* --------------------------------------------------
   PANELS
-------------------------------------------------- */

.panel {
    background: rgba(8,17,27,.94);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 18px;
    margin-bottom: 18px;
}

.panel-title {
    color: var(--cyan);
    border-bottom: 1px solid rgba(53,217,255,.25);
    padding-bottom: 9px;
    margin-bottom: 15px;
    text-transform: uppercase;
    letter-spacing: .08em;
}

.grid {
    display: grid;
    gap: 12px;
}

.grid-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
}

.grid-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
}

.grid-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
}

/* --------------------------------------------------
   CHARACTER SHEET
-------------------------------------------------- */

.empty-state {
    padding: 80px 20px;
    text-align: center;
    color: var(--muted);
    border: 1px dashed var(--border);
}

.empty-state strong {
    color: var(--cyan);
    display: block;
    margin-bottom: 10px;
}

/* --------------------------------------------------
   CREATOR MODAL
-------------------------------------------------- */

.modal {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    background: rgba(0,0,0,.78);
    backdrop-filter: blur(5px);
}

.modal.open {
    display: flex;
    justify-content: center;
    align-items: center;
}

.creator {
    width: min(1250px, 96vw);
    height: min(92vh, 1000px);
    background: #07101a;
    border: 1px solid var(--cyan);
    box-shadow: 0 0 50px rgba(53,217,255,.16);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.creator-header {
    padding: 15px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.creator-title {
    color: var(--cyan);
    font-size: 1.2rem;
}

.creator-steps {
    display: flex;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
}

.step-tab {
    padding: 10px 14px;
    border-right: 1px solid var(--border);
    color: var(--muted);
    white-space: nowrap;
    cursor: pointer;
}

.step-tab.active {
    color: var(--cyan);
    background: rgba(53,217,255,.08);
}

.creator-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.creator-footer {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

/* --------------------------------------------------
   STATISTICS
-------------------------------------------------- */

.stat-card {
    border: 1px solid var(--border);
    padding: 12px;
    background: rgba(10,24,37,.75);
}

.stat-name {
    color: var(--cyan);
    font-weight: bold;
}

.stat-description {
    color: var(--muted);
    font-size: .7rem;
    margin-bottom: 8px;
}

.stat-control {
    display: grid;
    grid-template-columns: 1fr 65px;
    gap: 10px;
    align-items: center;
}

.stat-control input[type="range"] {
    width: 100%;
}

.number-input {
    width: 100%;
    background: #050c14;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 7px;
    text-align: center;
}

.stat-values {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: .72rem;
    margin-top: 7px;
}

.points-banner {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(4,12,20,.97);
    border: 1px solid var(--cyan);
    padding: 12px 15px;
    margin-bottom: 15px;
    display: flex;
    justify-content: space-between;
    gap: 15px;
}

.points-banner .value {
    color: var(--green);
    font-weight: bold;
}

.points-banner.invalid .value {
    color: var(--red);
}

/* --------------------------------------------------
   AGE
-------------------------------------------------- */

.age-option {
    border: 1px solid var(--border);
    padding: 13px;
    cursor: pointer;
}

.age-option.selected {
    border-color: var(--cyan);
    background: rgba(53,217,255,.08);
}

.age-option input {
    display: none;
}

.penalty-row {
    display: grid;
    grid-template-columns: 1fr 100px;
    gap: 10px;
    align-items: center;
    margin-bottom: 8px;
}

.penalty-total {
    padding: 10px;
    border: 1px solid var(--border);
    margin-top: 10px;
}

/* --------------------------------------------------
   SKILLS
-------------------------------------------------- */

/*
   La barre suivante est volontairement sticky.
   Elle reste visible lorsque la liste des compétences
   est longue et que le joueur fait défiler le créateur.
*/

.skill-credit-bar {
    position: sticky;
    top: 0;
    z-index: 50;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    background: rgba(3,10,17,.98);
    border: 1px solid var(--cyan);
    padding: 10px;
    margin-bottom: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,.5);
}

.credit-box {
    text-align: center;
    padding: 8px;
    border: 1px solid var(--border);
}

.credit-box span {
    display: block;
    font-size: .68rem;
    color: var(--muted);
    text-transform: uppercase;
}

.credit-box strong {
    color: var(--green);
    font-size: 1.05rem;
}

.credit-box.invalid strong {
    color: var(--red);
}

.skills-table {
    width: 100%;
    border-collapse: collapse;
}

.skills-table th,
.skills-table td {
    border: 1px solid rgba(27,102,128,.45);
    padding: 6px;
}

.skills-table th {
    color: var(--cyan);
    background: #091722;
    font-size: .72rem;
    text-transform: uppercase;
    position: sticky;
    top: 83px;
    z-index: 10;
}

.skills-table td {
    font-size: .78rem;
}

.skill-name {
    font-weight: bold;
}

.skill-prof {
    background: rgba(88,245,174,.07);
}

.prof-badge {
    color: var(--green);
    border: 1px solid var(--green);
    font-size: .6rem;
    padding: 2px 4px;
    margin-left: 5px;
}

.skill-number {
    width: 70px;
    background: #040b12;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 5px;
    text-align: center;
}

.base-value,
.final-value {
    text-align: center;
}

.final-value {
    color: var(--cyan-soft);
    font-weight: bold;
}

.derived-mini {
    color: var(--muted);
    font-size: .7rem;
}

/* --------------------------------------------------
   FORMULAIRES
-------------------------------------------------- */

label {
    display: block;
    color: var(--muted);
    font-size: .72rem;
    margin-bottom: 5px;
}

input[type="text"],
input[type="number"],
select,
textarea {
    width: 100%;
    background: #050c14;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 9px;
    outline: none;
}

input:focus,
select:focus,
textarea:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 8px rgba(53,217,255,.1);
}

textarea {
    min-height: 110px;
    resize: vertical;
}

.required-field.empty-field {
    border-color: var(--red);
    box-shadow: 0 0 8px rgba(255,89,100,.13);
}

.required-field:not(.empty-field) {
    border-color: var(--green);
}

/* --------------------------------------------------
   SHEET SCREEN
-------------------------------------------------- */

.sheet-header {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 15px;
    align-items: center;
}

.sheet-name {
    font-size: 1.6rem;
    color: var(--cyan);
}

.sheet-callsign {
    color: var(--green);
}

.stat-sheet-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.sheet-stat {
    border: 1px solid var(--border);
    padding: 10px;
    text-align: center;
}

.sheet-stat .big {
    font-size: 1.4rem;
    color: var(--cyan);
    font-weight: bold;
}

.sheet-stat .small {
    font-size: .65rem;
    color: var(--muted);
}

.derived-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
}

.derived-card {
    border: 1px solid var(--border);
    padding: 10px;
    text-align: center;
}

.derived-card strong {
    display: block;
    color: var(--green);
    font-size: 1.1rem;
    margin-top: 5px;
}

.sheet-skills {
    columns: 2;
    column-gap: 18px;
}

.sheet-skill {
    break-inside: avoid;
    border-bottom: 1px solid rgba(27,102,128,.35);
    padding: 5px 2px;
    display: grid;
    grid-template-columns: 1fr 45px 45px 45px;
    gap: 4px;
}

.sheet-skill.professional {
    border-left: 3px solid var(--green);
    padding-left: 6px;
}

.profile-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.profile-full {
    grid-column: 1 / -1;
}

.equipment-row {
    display: grid;
    grid-template-columns: 1fr 70px 35px;
    gap: 7px;
    margin-bottom: 7px;
}

.equipment-row button {
    border: 1px solid var(--border);
    background: #07131e;
    color: var(--cyan);
}

.item-picker {
    max-height: 55vh;
    overflow-y: auto;
}

.item-option {
    border: 1px solid var(--border);
    padding: 10px;
    margin-bottom: 7px;
    cursor: pointer;
}

.item-option:hover {
    border-color: var(--cyan);
    background: rgba(53,217,255,.08);
}

.item-option strong {
    color: var(--cyan);
}

.item-option small {
    display: block;
    color: var(--muted);
    margin-top: 4px;
}

/* --------------------------------------------------
   PRINT
-------------------------------------------------- */

.print-sheet {
    display: none;
}

@media print {

    @page {
        size: A4 portrait;
        margin: 8mm;
    }

    body {
        background: #fff !important;
        color: #000 !important;
    }

    .app,
    .modal {
        display: none !important;
    }

    .print-sheet {
        display: block !important;
    }

    .print-page {
        width: 194mm;
        min-height: 281mm;
        max-height: 281mm;
        overflow: hidden;
        color: #000;
        background: #fff;
        page-break-after: always;
        break-after: page;
        font-family: Arial, sans-serif;
        font-size: 8pt;
    }

    .print-page:last-child {
        page-break-after: auto;
        break-after: auto;
    }

    .print-header {
        border-bottom: 2px solid #000;
        padding-bottom: 5px;
        margin-bottom: 8px;
    }

    .print-title {
        font-size: 16pt;
        font-weight: bold;
    }

    .print-subtitle {
        font-size: 8pt;
    }

    .print-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        margin-bottom: 7px;
    }

    .print-box {
        border: 1px solid #000;
        padding: 4px;
    }

    .print-box strong {
        display: block;
    }

    .print-stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 3px;
    }

    .print-stat {
        border: 1px solid #000;
        padding: 4px;
        text-align: center;
    }

    .print-stat .value {
        font-size: 12pt;
        font-weight: bold;
    }

    .print-derived {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 3px;
        margin: 6px 0;
    }

    .print-skill-columns {
        columns: 2;
        column-gap: 10px;
    }

    .print-skill {
        break-inside: avoid;
        display: grid;
        grid-template-columns: 1fr 25px 25px 25px 25px;
        border-bottom: 1px solid #bbb;
        padding: 2px 0;
    }

    .print-skill.prof {
        font-weight: bold;
    }

    .print-section-title {
        font-size: 9pt;
        font-weight: bold;
        border-bottom: 1px solid #000;
        margin: 7px 0 4px;
        padding-bottom: 2px;
    }

    .print-profile-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
    }

    .print-profile-box {
        border: 1px solid #000;
        min-height: 38mm;
        padding: 4px;
    }

    .print-profile-box.full {
        grid-column: 1 / -1;
    }

    .print-equipment {
        display: grid;
        grid-template-columns: 1fr 35px;
        border: 1px solid #000;
    }

    .print-equipment div {
        border-bottom: 1px solid #aaa;
        padding: 4px;
        min-height: 7mm;
    }

    .print-note {
        border: 1px solid #000;
        min-height: 35mm;
        padding: 5px;
    }
}

/* --------------------------------------------------
   RESPONSIVE
-------------------------------------------------- */

@media (max-width: 900px) {
    .grid-3,
    .grid-4,
    .stat-sheet-grid,
    .derived-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .profile-grid {
        grid-template-columns: 1fr;
    }

    .profile-full {
        grid-column: auto;
    }

    .sheet-skills {
        columns: 1;
    }

    .skills-table {
        min-width: 850px;
    }

    .skills-scroll {
        overflow-x: auto;
    }
}

@media (max-width: 600px) {
    .topbar {
        flex-direction: column;
        align-items: flex-start;
    }

    .grid-2,
    .grid-3,
    .grid-4,
    .stat-sheet-grid,
    .derived-grid {
        grid-template-columns: 1fr;
    }

    .skill-credit-bar {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="topbar">
        <div>
            <div class="logo">EXPLORER // PERSONNAGE</div>
            <div class="subtitle">
                Système d'aventure scientifique et spatiale
            </div>
        </div>

        <div class="toolbar">
            <button class="btn primary" id="createCharacterBtn">
                Créer un personnage
            </button>

            <button class="btn" id="exportBtn">
                Télécharger JSON
            </button>

            <button class="btn" id="importBtn">
                Charger JSON
            </button>

            <button class="btn green" id="printBtn">
                Imprimer
            </button>

            <input
                type="file"
                id="importFile"
                accept=".json,application/json"
                hidden
            >
        </div>
    </header>

    <main id="characterSheet">

        <div class="empty-state">
            <strong>AUCUN PERSONNAGE CHARGÉ</strong>
            Créez un nouveau personnage ou chargez une fiche JSON existante.
        </div>

    </main>

</div>


<!-- ==================================================
     MODALE DE CRÉATION
================================================== -->

<div class="modal" id="creatorModal">

    <div class="creator">

        <div class="creator-header">
            <div class="creator-title">
                CRÉATION DU PERSONNAGE
            </div>

            <button class="btn danger" id="closeCreatorBtn">
                Fermer
            </button>
        </div>

        <div class="creator-steps" id="stepTabs">

            <div class="step-tab active" data-step="1">
                1. Caractéristiques
            </div>

            <div class="step-tab" data-step="2">
                2. Âge
            </div>

            <div class="step-tab" data-step="3">
                3. Chance & dérivés
            </div>

            <div class="step-tab" data-step="4">
                4. Métier
            </div>

            <div class="step-tab" data-step="5">
                5. Compétences
            </div>

            <div class="step-tab" data-step="6">
                6. Validation
            </div>

        </div>

        <div class="creator-body" id="creatorBody"></div>

        <div class="creator-footer">

            <button class="btn" id="previousStepBtn">
                ← Retour
            </button>

            <button class="btn primary" id="nextStepBtn">
                Suivant →
            </button>

        </div>

    </div>

</div>


<!-- ==================================================
     MODALE ÉQUIPEMENT
================================================== -->

<div class="modal" id="equipmentModal">

    <div class="creator" style="height:min(75vh,800px)">

        <div class="creator-header">
            <div class="creator-title">
                AJOUTER UN OBJET
            </div>

            <button class="btn danger" id="closeEquipmentBtn">
                Fermer
            </button>
        </div>

        <div class="creator-body">
            <div id="equipmentPicker" class="item-picker"></div>
        </div>

    </div>

</div>


<!-- ==================================================
     FICHE IMPRIMABLE
================================================== -->

<div class="print-sheet" id="printSheet"></div>


<script>
"use strict";

/* =====================================================
   DONNÉES PAR DÉFAUT
===================================================== */

const STAT_DEFINITIONS = {
    STR: {
        label: "Force",
        description: "Puissance physique"
    },
    CON: {
        label: "Constitution",
        description: "Résistance physique"
    },
    DEX: {
        label: "Dextérité",
        description: "Agilité et réflexes"
    },
    INT: {
        label: "Intelligence",
        description: "Analyse et raisonnement"
    },
    POW: {
        label: "Pouvoir",
        description: "Volonté et présence mentale"
    },
    EDU: {
        label: "Éducation",
        description: "Connaissances acquises"
    },
    APP: {
        label: "Apparence",
        description: "Présence et impact social"
    },
    SIZ: {
        label: "Taille",
        description: "Masse et stature"
    }
};


/*
    Les caractéristiques par défaut totalisent exactement 460.

    Elles servent uniquement de point de départ.
*/
const DEFAULT_BASE_STATS = {
    STR: 55,
    CON: 55,
    DEX: 55,
    INT: 55,
    POW: 55,
    EDU: 65,
    APP: 40,
    SIZ: 80
};


const DEFAULT_PROFILE = {
    name: "",
    callsign: "",
    pronouns: "",
    origin: "",
    background: "",
    personality: "",
    motivations: "",
    relationships: "",
    appearance: "",
    currentSituation: "",
    notes: ""
};


function blankEquipment(count = 10) {
    return Array.from(
        { length: count },
        () => ({
            name: "",
            quantity: "",
            notes: ""
        })
    );
}


function createInitialCharacter() {

    return {
        version: 1,

        baseStats: { ...DEFAULT_BASE_STATS },

        stats: { ...DEFAULT_BASE_STATS },

        age: 20,

        agePenalties: {
            STR: 0,
            CON: 0,
            DEX: 0,
            SIZ: 0
        },

        educationRollUsed: false,

        educationRoll: null,

        luck: null,

        luckRollUsed: false,

        occupationId: "",

        skillAllocations: {},

        profile: { ...DEFAULT_PROFILE },

        equipment: blankEquipment(),

        derived: {},

        created: false
    };
}


/*
    IMPORTANT :
    character est l'état unique de toute la création.

    On ne recrée jamais cet objet lorsque l'utilisateur
    change d'étape.
*/
let character = createInitialCharacter();

let jobs = [];
let skills = {};
let equipmentItems = [];

let currentStep = 1;


/* =====================================================
   DONNÉES DE SECOURS
   Utilisées si les JSON ne sont pas disponibles.
===================================================== */

const FALLBACK_SKILLS = [
    { id:"anthropologie", name:"Anthropologie", base:"1" },
    { id:"histoire", name:"Histoire", base:"10" },
    { id:"bricolage", name:"Bricolage", base:"10" },
    { id:"mecanique", name:"Mécanique", base:"1" },
    { id:"baratin", name:"Baratin", base:"5" },

/* =====================================================

===================================================== */

async function loadSkills() {

    try {

        const response = await fetch("skills.json", {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("skills.json introuvable");
        }

        const data = await response.json();

        skills = normalizeSkills(data);

    } catch (error) {

        console.warn(error);

        skills = normalizeSkills(FALLBACK_SKILLS);
    }

    ensureSkillAllocations();
}


async function loadJobs() {

    try {

        const response = await fetch("jobs.json", {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("jobs.json introuvable");
        }

        jobs = await response.json();

    } catch (error) {

        console.warn(error);

        jobs = FALLBACK_JOBS;
    }

    populateJobSelect();
}


async function loadEquipment() {

    try {

        const response = await fetch("equipment.json", {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("equipment.json introuvable");
        }

        equipmentItems = await response.json();

    } catch (error) {

        console.warn(error);

        equipmentItems = FALLBACK_EQUIPMENT;
    }
}


function normalizeSkills(data) {

    const result = {};

    if (!Array.isArray(data)) {
        return result;
    }

    data.forEach(skill => {

        if (!skill.id) {
            return;
        }

        result[skill.id] = {
            id: skill.id,
            name: skill.name || skill.nom || skill.id,
            base: skill.base ?? skill.valeur ?? "1"
        };
    });

    return result;
}

/* =====================================================
   UTILITAIRES
===================================================== */

function clamp(value, min, max) {

    value = Number(value);

    if (!Number.isFinite(value)) {
        value = min;
    }

    return Math.max(min, Math.min(max, Math.round(value)));
}


function rollDie(sides) {

    return Math.floor(Math.random() * sides) + 1;
}


function rollDice(count, sides) {

    const results = [];

    for (let i = 0; i < count; i++) {
        results.push(rollDie(sides));
    }

    return results;
}


function sumBaseStats() {

    return Object.values(character.baseStats)
        .reduce((sum, value) => sum + Number(value), 0);
}


function agePenaltyRequirement() {

    const age = Number(character.age);

    if (age >= 80) {
        return {
            total: 80,
            stats: ["STR", "CON", "DEX"],
            app: 25
        };
    }

    if (age >= 70) {
        return {
            total: 40,
            stats: ["STR", "CON", "DEX"],
            app: 20
        };
    }

    if (age >= 60) {
        return {
            total: 20,
            stats: ["STR", "CON", "DEX"],
            app: 15
        };
    }

    if (age >= 50) {
        return {
            total: 10,
            stats: ["STR", "CON", "DEX"],
            app: 10
        };
    }

    if (age >= 40) {
        return {
            total: 5,
            stats: ["STR", "CON", "DEX"],
            app: 5
        };
    }

    if (age >= 15) {
        return {
            total: 5,
            stats: ["STR", "SIZ"],
            app: 0
        };
    }

    return {
        total: 0,
        stats: [],
        app: 0
    };
}


function recomputeStats() {

    const result = { ...character.baseStats };

    const requirement = agePenaltyRequirement();

    Object.keys(character.agePenalties).forEach(stat => {

        result[stat] = Math.max(
            1,
            Number(result[stat]) -
            Number(character.agePenalties[stat] || 0)
        );
    });

    if (character.age >= 15 && character.age <= 19) {
        result.EDU = Math.max(1, result.EDU - 5);
    }

    if (requirement.app > 0) {
        result.APP = Math.max(
            1,
            result.APP - requirement.app
        );
    }

    if (
        character.educationRollUsed &&
        character.educationRoll &&
        character.educationRoll.success
    ) {

        result.EDU = Math.min(
            99,
            result.EDU + character.educationRoll.bonus
        );
    }

    character.stats = result;

    computeDerived();
}


function computeDerived() {

    const s = character.stats;

    const hp = Math.floor(
        (Number(s.CON) + Number(s.SIZ)) / 10
    );

    const total = Number(s.STR) + Number(s.SIZ);

    let damageBonus = "0";
    let build = 0;

    if (total <= 64) {
        damageBonus = "-2";
        build = -2;
    } else if (total <= 84) {
        damageBonus = "-1";
        build = -1;
    } else if (total <= 124) {
        damageBonus = "0";
        build = 0;
    } else if (total <= 164) {
        damageBonus = "+1d4";
        build = 1;
    } else {
        damageBonus = "+1d6";
        build = 2;
    }

    let movement;

    if (
        Number(s.STR) > Number(s.SIZ) &&
        Number(s.DEX) > Number(s.SIZ)
    ) {

        movement = 9;

    } else if (
        Number(s.STR) >= Number(s.SIZ) ||
        Number(s.DEX) >= Number(s.SIZ)
    ) {

        movement = 8;

    } else {

        movement = 7;
    }


    if (character.age >= 40) movement -= 1;
    if (character.age >= 50) movement -= 1;
    if (character.age >= 60) movement -= 1;
    if (character.age >= 70) movement -= 1;
    if (character.age >= 80) movement -= 1;

    movement = Math.max(1, movement);

    character.derived = {
        hp,
        damageBonus,
        build,
        movement,
        dodgeBase: Math.floor(Number(s.DEX) / 2)
    };
}


function half(value) {

    return Math.floor(Number(value) / 2);
}


function fifth(value) {

    return Math.floor(Number(value) / 5);
}


/* =====================================================
   COMPÉTENCES
===================================================== */

function ensureSkillAllocations() {

    Object.keys(skills).forEach(id => {

        if (!character.skillAllocations[id]) {

            character.skillAllocations[id] = {
                professional: 0,
                personal: 0
            };
        }
    });
}


function getSkillBase(id) {

    const skill = skills[id];

    if (!skill) {
        return 0;
    }

    const base = String(skill.base)
        .trim()
        .toUpperCase();

    if (base === "EDU") {
        return Math.floor(Number(character.stats.EDU));
    }

    if (base === "DEX/2") {
        return Math.floor(Number(character.stats.DEX) / 2);
    }

    if (base === "DEX/4") {
        return Math.floor(Number(character.stats.DEX) / 4);
    }

    if (base === "FOR/2" || base === "STR/2") {
        return Math.floor(Number(character.stats.STR) / 2);
    }

    const parsed = Number(base);

    return Number.isFinite(parsed) ? parsed : 0;
}


function getSelectedJob() {

    return jobs.find(
        job => job.id === character.occupationId
    ) || null;
}


function isProfessionalSkill(id) {

    const job = getSelectedJob();

    if (!job || !Array.isArray(job.skills)) {
        return false;
    }

    return job.skills.includes(id);
}


function getProfessionalPoints() {

    const job = getSelectedJob();

    if (!job) {
        return 0;
    }

    const edu = Number(character.stats.EDU);
    const str = Number(character.stats.STR);
    const dex = Number(character.stats.DEX);
    const app = Number(character.stats.APP);

    switch (job.category) {

        case "intellectual":
            return 4 * edu;

        case "manual":
            return 2 * edu + 2 * Math.max(str, dex);

        case "social":
            return 2 * edu + 2 * app;

        default:
            return 0;
    }
}


function getPersonalPoints() {

    return Number(character.stats.INT) * 2;
}


function getProfessionalSpent() {

    return Object.entries(character.skillAllocations)
        .reduce((sum, [id, allocation]) => {

            /*
                IMPORTANT :
                seules les compétences du métier
                peuvent consommer les crédits professionnels.
            */

            if (!isProfessionalSkill(id)) {
                return sum;
            }

            return sum + Number(
                allocation.professional || 0
            );

        }, 0);
}


function getPersonalSpent() {

    return Object.values(character.skillAllocations)
        .reduce(
            (sum, allocation) =>
                sum + Number(allocation.personal || 0),
            0
        );
}


function getSkillFinal(id) {

    const base = getSkillBase(id);

    const allocation =
        character.skillAllocations[id] || {
            professional: 0,
            personal: 0
        };

    /*
        Protection supplémentaire :
        une éventuelle valeur professionnelle
        présente dans un JSON chargé pour une
        compétence hors métier est ignorée.
    */

    const professional = isProfessionalSkill(id)
        ? Number(allocation.professional || 0)
        : 0;

    const personal =
        Number(allocation.personal || 0);

    return Math.min(
        99,
        base + professional + personal
    );
}


function skillMaxAdditional(id, pool) {

    const base = getSkillBase(id);

    const allocation =
        character.skillAllocations[id] || {
            professional: 0,
            personal: 0
        };

    if (pool === "professional") {

        const personal =
            Number(allocation.personal || 0);

        return Math.max(
            0,
            99 - base - personal
        );
    }

    const professional =
        isProfessionalSkill(id)
            ? Number(allocation.professional || 0)
            : 0;

    return Math.max(
        0,
        99 - base - professional
    );
}

===================================================== */

function openCreator() {

    const alreadyCreated =
        character.created ||
        character.profile.name ||
        character.occupationId;

    if (alreadyCreated) {

        const confirmed = confirm(
            "Un personnage existe déjà.\n\n" +
            "Créer un nouveau personnage effacera la création actuelle.\n\n" +
            "Continuer ?"
        );

        if (!confirmed) {
            return;
        }

        character = createInitialCharacter();

        ensureSkillAllocations();
    }

    currentStep = 1;

    document
        .getElementById("creatorModal")
        .classList.add("open");

    renderCreator();
}


function closeCreator() {

    document
        .getElementById("creatorModal")
        .classList.remove("open");
}


/* =====================================================
   RENDU DU CRÉATEUR
===================================================== */

function renderCreator() {

    recomputeStats();

    const body =
        document.getElementById("creatorBody");

    switch (currentStep) {

        case 1:
            renderStep1(body);
            break;

        case 2:
            renderStep2(body);
            break;

        case 3:
            renderStep3(body);
            break;

        case 4:
            renderStep4(body);
            break;

        case 5:
            renderStep5(body);
            break;

        case 6:
            renderStep6(body);
            break;
    }

    document
        .querySelectorAll(".step-tab")
        .forEach(tab => {

            tab.classList.toggle(
                "active",
                Number(tab.dataset.step) === currentStep
            );
        });

    document.getElementById(
        "previousStepBtn"
    ).disabled = currentStep === 1;

    document.getElementById(
        "nextStepBtn"
    ).textContent =
        currentStep === 6
            ? "Valider le personnage"
            : "Suivant →";
}

function renderStatControl(stat) {

    const definition = STAT_DEFINITIONS[stat];
    const value = character.baseStats[stat];

    return `

            <div class="stat-name">
                ${stat} — ${definition.label}
            </div>

            <div class="stat-description">
                ${definition.description}
            </div>

            <div class="stat-control">

                <input
                    type="range"
                    min="15"
                    max="90"
                    value="${value}"
                    data-stat-range="${stat}"
                >

                <input
                    type="number"
                    min="15"
                    max="90"
                    value="${value}"
                    class="number-input"
                    data-stat-number="${stat}"
                >

            </div>

            <div class="stat-values">
                <span>½ : ${half(value)}</span>
                <span>⅕ : ${fifth(value)}</span>
            </div>

        </div>
    `;
}

function rollEducation() {

    if (character.educationRollUsed) {
        return;
    }

    recomputeStats();

    const baseEdu =
        Number(character.stats.EDU);

    const d100 = rollDie(100);

    let d10 = null;
    let bonus = 0;
    let success = false;

    if (d100 > baseEdu) {

        success = true;

        d10 = rollDie(10);

        bonus = d10;
    }

    character.educationRollUsed = true;

    character.educationRoll = {
        d100,
        d10,
        bonus,
        success,
        baseEdu
    };

    recomputeStats();

    renderStep2(
        document.getElementById("creatorBody")
    );
}

function getValidationErrors() {

    const errors = [];

    recomputeStats();

    if (sumBaseStats() !== 460) {
        errors.push(
            "Les caractéristiques doivent totaliser exactement 460 points."
        );
    }

    const requirement =
        agePenaltyRequirement();

    const penaltyTotal =
        Object.values(character.agePenalties)
            .reduce(
                (sum, value) =>
                    sum + Number(value || 0),
                0
            );

    if (penaltyTotal !== requirement.total) {

        errors.push(
            `La répartition des pénalités doit totaliser ${requirement.total} points.`
        );
    }

    if (!character.educationRollUsed) {

        errors.push(
            "Le jet unique d'Éducation doit être effectué."
        );
    }

    if (!character.luckRollUsed) {

        errors.push(
            "Le jet unique de Chance doit être effectué."
        );
    }

    if (!character.occupationId) {

        errors.push(
            "Un métier doit être sélectionné."
        );
    }

    const professionalRemaining =
        getProfessionalPoints() -
        getProfessionalSpent();

    if (professionalRemaining < 0) {

        errors.push(
            "Les crédits professionnels dépensés dépassent le total disponible."
        );
    }

    const personalRemaining =
        getPersonalPoints() -
        getPersonalSpent();

    if (personalRemaining < 0) {

        errors.push(
            "Les crédits personnels dépensés dépassent le total disponible."
        );
    }


    Object.keys(skills).forEach(id => {

        const allocation =
            character.skillAllocations[id];

        if (!allocation) {
            return;
        }

        /*
            Nettoyage logique :
            les crédits professionnels hors métier
            sont considérés comme invalides.
        */

        if (
            Number(allocation.professional || 0) > 0 &&
            !isProfessionalSkill(id)
        ) {

            errors.push(
                `La compétence "${skills[id].name}" ne peut pas recevoir de crédits professionnels avec ce métier.`
            );
        }

        if (getSkillFinal(id) > 99) {

            errors.push(
                `La compétence "${skills[id].name}" dépasse 99.`
            );
        }
    });

    return errors;
}


/* =====================================================
   NAVIGATION
===================================================== */

function validateStepsUntil(target) {

    /*
        Les étapes précédentes sont vérifiées uniquement
        pour empêcher de sauter une étape sans données
        essentielles.
    */

    if (target >= 2 && sumBaseStats() !== 460) {

        alert(
            "Les caractéristiques doivent totaliser exactement 460 points."
        );

        return false;
    }

    if (target >= 4 && !character.luckRollUsed) {

        /*
            On ne bloque pas ici pour permettre de revenir
            librement. La validation finale bloquera.
        */
    }

    return true;
}


function nextStep() {

    if (currentStep < 6) {

        if (!validateCurrentStep()) {
            return;
        }

        currentStep++;

        renderCreator();

        return;
    }

    const errors =
        getValidationErrors();

    if (errors.length > 0) {

        alert(
            "Le personnage ne peut pas encore être validé.\n\n" +
            errors.map(e => "• " + e).join("\n")
        );

        return;
    }

    character.created = true;

    saveProfileFromScreen();

    closeCreator();

    renderCharacterSheet();
}


function previousStep() {

    if (currentStep <= 1) {
        return;
    }

    currentStep--;

    renderCreator();
}


function validateCurrentStep() {

    if (currentStep === 1) {

        if (sumBaseStats() !== 460) {

            alert(
                "Répartissez exactement 460 points avant de continuer."
            );

            return false;
        }
    }

    if (currentStep === 2) {

        const requirement =
            agePenaltyRequirement();

        const total =
            Object.values(character.agePenalties)
                .reduce(
                    (sum, value) =>
                        sum + Number(value || 0),
                    0
                );

        if (total !== requirement.total) {

            alert(
                `La répartition des pénalités doit totaliser ${requirement.total} points.`
            );

            return false;
        }
    }

    if (currentStep === 4) {

        if (!character.occupationId) {

            alert(
                "Sélectionnez un métier."
            );

            return false;
        }
    }

    if (currentStep === 5) {

        const profRemaining =
            getProfessionalPoints() -
            getProfessionalSpent();

        const personalRemaining =
            getPersonalPoints() -
            getPersonalSpent();

        if (profRemaining < 0) {

            alert(
                "Vous avez dépensé trop de crédits professionnels."
            );

            return false;
        }

        if (personalRemaining < 0) {

            alert(
                "Vous avez dépensé trop de crédits personnels."
            );

            return false;
        }
    }

    return true;
}

                    </div>

                </div>

                <div>
                    <strong>
                        ${
                            job

        </section>


        <section class="panel">

            <div class="panel-title">

            <div class="stat-sheet-grid">

                    .map(stat => `

                        <div class="sheet-stat">

                            <div>
                                ${stat}
                            </div>

                            <div class="big">
                                ${character.stats[stat]}
                            </div>

                            <div class="small">
                                ${STAT_DEFINITIONS[stat].label}
                            </div>

                            <div class="small">
                                ½ ${half(character.stats[stat])}
                                |
                                ⅕ ${fifth(character.stats[stat])}
                            </div>

                        </div>

                    `)
                    .join("")}

            </div>

        </section>


        <section class="panel">

            <div class="panel-title">
                Valeurs dérivées
            </div>

            <div class="derived-grid">

                <div class="derived-card">
                    PV maximum
                    <strong>${character.derived.hp}</strong>
                </div>

                <div class="derived-card">
                    PV actuels
                    <strong>&nbsp;</strong>
                </div>

                <div class="derived-card">
                    Chance
                    <strong>
                        ${character.luck?.value ?? ""}
                    </strong>
                </div>

                <div class="derived-card">
                    Bonus dégâts
                    <strong>
                        ${character.derived.damageBonus}
                    </strong>
                </div>

                <div class="derived-card">
                    Mouvement
                    <strong>
                        ${character.derived.movement}
                    </strong>
                </div>

            </div>

        </section>


        <section class="panel">

            <div class="panel-title">
                Compétences
            </div>

            <div class="sheet-skills">

                ${Object.keys(skills)
                    .map(id =>
                        renderSheetSkill(id)
                    )
                    .join("")}

            </div>

        </section>


        <section class="panel">

            <div class="panel-title">
                Profil
            </div>

            <div class="profile-grid">

                ${profileInput(
                    "Nom",
                    "name",
                    character.profile.name
                )}

                ${profileInput(
                    "Indicatif",
                    "callsign",
                    character.profile.callsign
                )}

                ${profileInput(
                    "Pronoms",
                    "pronouns",
                    character.profile.pronouns
                )}

                ${profileInput(
                    "Origine",
                    "origin",
                    character.profile.origin
                )}

                ${profileTextarea(
                    "Histoire / Background",
                    "background",
                    character.profile.background,
                    true
                )}

                ${profileTextarea(
                    "Personnalité",
                    "personality",
                    character.profile.personality
                )}

                ${profileTextarea(
                    "Motivations",
                    "motivations",
                    character.profile.motivations
                )}

                ${profileTextarea(
                    "Relations",
                    "relationships",
                    character.profile.relationships
                )}

                ${profileTextarea(
                    "Apparence",
                    "appearance",
                    character.profile.appearance
                )}

                ${profileTextarea(
                    "Situation actuelle",
                    "currentSituation",
                    character.profile.currentSituation
                )}

                ${profileTextarea(
                    "Notes",
                    "notes",
                    character.profile.notes,
                    true
                )}

            </div>

        </section>


        <section class="panel">

            <div class="panel-title">
                Équipement / Charge
            </div>

            <button
                class="btn green"
                id="addEquipmentBtn"
            >
                + Ajouter un objet
            </button>

            <div style="margin-top:12px">

                    .map((item, index) =>

                    )
                    .join("")}

    renderPrintSheet();
}


function renderSheetSkill(id) {

    const skill = skills[id];

    if (!skill) {
        return "";
    }

    const final =
        getSkillFinal(id);

    const professional =
        isProfessionalSkill(id);

    return `
        <div class="sheet-skill ${
            professional
                ? "professional"
                : ""
        }">

            <div>
                ${escapeHtml(skill.name)}

                ${
                    professional
                        ? `
                            <span class="prof-badge">
                                MÉTIER
                            </span>
                        `
                        : ""
                }
            </div>

            <div>
                ${final}
            </div>

            <div>
                ${half(final)}
            </div>

            <div>
                ${fifth(final)}
            </div>

        </div>
    `;
}


/* =====================================================
   PROFIL
===================================================== */

function profileInput(label, key, value) {

    const empty =
        !String(value || "").trim();

    return `
        <div>

            <label>${label}</label>

            <input
                type="text"
                class="required-field ${empty ? "empty-field" : ""}"
                data-profile="${key}"
                value="${escapeAttribute(value || "")}"
            >

        </div>
    `;
}


function profileTextarea(label, key, value, full = false) {

    const empty =
        !String(value || "").trim();

    return `
        <div class="${full ? "profile-full" : ""}">

            <label>${label}</label>

            <textarea
                class="required-field ${empty ? "empty-field" : ""}"
                data-profile="${key}"
            >${escapeHtml(value || "")}</textarea>

        </div>
    `;
}


function bindCharacterSheetEvents() {

    document
        .querySelectorAll("[data-profile]")
        .forEach(input => {

            input.addEventListener("input", event => {

                const key =
                    event.target.dataset.profile;

                character.profile[key] =
                    event.target.value;

                event.target.classList.toggle(
                    "empty-field",
                    !event.target.value.trim()
                );

                renderPrintSheet();
            });
        });


    document
        .querySelectorAll("[data-equipment-name]")
        .forEach(input => {

            input.addEventListener("input", event => {

                const index =
                    Number(
                        event.target.dataset.equipmentName
                    );

                character.equipment[index].name =
                    event.target.value;

                renderPrintSheet();
            });
        });


    document
        .querySelectorAll("[data-equipment-quantity]")
        .forEach(input => {

            input.addEventListener("input", event => {

                const index =
                    Number(
                        event.target.dataset.equipmentQuantity
                    );

                character.equipment[index].quantity =
                    event.target.value;

                renderPrintSheet();
            });
        });


    document
        .querySelectorAll("[data-equipment-notes]")
        .forEach(input => {

            input.addEventListener("input", event => {

                const index =
                    Number(
                        event.target.dataset.equipmentNotes
                    );

                character.equipment[index].notes =
                    event.target.value;

                renderPrintSheet();
            });
        });


    document
        .querySelectorAll("[data-equipment-focus]")
        .forEach(button => {

            button.addEventListener("click", event => {

                const index =
                    Number(
                        event.target.dataset.equipmentFocus
                    );

                const input =
                    document.querySelector(
                        `[data-equipment-name="${index}"]`
                    );

                if (input) {
                    input.focus();
                }
            });
        });


    document
        .getElementById("addEquipmentBtn")
        .addEventListener(
            "click",
            openEquipmentModal
        );
}


function renderEquipmentRow(item, index) {

    return `
        <div class="equipment-row">

            <input
                type="text"
                placeholder="Ligne d'équipement..."
                value="${escapeAttribute(item.name || "")}"
                data-equipment-name="${index}"
            >

            <input
                type="text"
                placeholder="Qté"
                value="${escapeAttribute(item.quantity || "")}"
                data-equipment-quantity="${index}"
            >

            <button
                type="button"
                title="Modifier"
                data-equipment-focus="${index}"
            >
                ✎
            </button>

        </div>
    `;
}


function saveProfileFromScreen() {

    document
        .querySelectorAll("[data-profile]")
        .forEach(input => {

            const key =
                input.dataset.profile;

            character.profile[key] =
                input.value;
        });
}


/* =====================================================
   ÉQUIPEMENT
===================================================== */

function openEquipmentModal() {

    const modal =
        document.getElementById("equipmentModal");

    const picker =
        document.getElementById("equipmentPicker");

    picker.innerHTML =
        equipmentItems.map(item => `

            <div
                class="item-option"
                data-equipment-id="${escapeAttribute(item.id)}"
            >

                <strong>
                    ${escapeHtml(item.name)}
                </strong>

                <small>
                    ${escapeHtml(item.category || "")}
                </small>

                <small>
                    ${escapeHtml(item.description || "")}
                </small>

            </div>

        `).join("");

    picker
        .querySelectorAll("[data-equipment-id]")
        .forEach(element => {

            element.addEventListener(
                "click",
                () => {

                    const id =
                        element.dataset.equipmentId;

                    const item =
                        equipmentItems.find(
                            e => e.id === id
                        );

                    if (item) {
                        addEquipmentItem(item);
                    }
                }
            );
        });

    modal.classList.add("open");
}


function closeEquipmentModal() {

    document
        .getElementById("equipmentModal")
        .classList.remove("open");
}


function addEquipmentItem(item) {

    let index =
        character.equipment.findIndex(
            equipment =>
                !String(equipment.name || "").trim()
        );

    if (index === -1) {

        character.equipment.push({
            name: "",
            quantity: "",
            notes: ""
        });

        index =
            character.equipment.length - 1;
    }

    character.equipment[index] = {
        name: item.name,
        quantity: "1",
        notes: ""
    };

    closeEquipmentModal();

    renderCharacterSheet();
}


/* =====================================================
   EXPORT JSON
===================================================== */

function exportCharacter() {

    saveProfileFromScreen();

    character.created = true;

    const exportData = {
        format: "explorer-character",
        version: 1,
        exportedAt: new Date().toISOString(),

        character: character
    };

    const json =
        JSON.stringify(
            exportData,
            null,
            2
        );

    const blob =
        new Blob(
            [json],
            {
                type: "application/json"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    const safeName =
        (
            character.profile.name ||
            "personnage"
        )
            .replace(/[^a-z0-9À-ÿ_-]/gi, "_")
            .toLowerCase();

    link.href = url;
    link.download =
        `${safeName}_personnage.json`;

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);
}


/* =====================================================
   IMPORT JSON
===================================================== */

async function importCharacter(event) {

    const file =
        event.target.files[0];

    if (!file) {
        return;
    }

    try {

        const text =
            await file.text();

        const data =
            JSON.parse(text);

        const imported =
            data.character || data;

        validateImportedCharacter(imported);

        character =
            normalizeImportedCharacter(imported);

        ensureSkillAllocations();

        recomputeStats();

        renderCharacterSheet();

        alert(
            "Personnage chargé avec succès."
        );

    } catch (error) {

        console.error(error);

        alert(
            "Impossible de charger ce fichier JSON.\n\n" +
            error.message
        );

    } finally {

        event.target.value = "";
    }
}


function validateImportedCharacter(data) {

    if (
        !data ||
        typeof data !== "object"
    ) {

        throw new Error(
            "Le fichier ne contient pas un personnage valide."
        );
    }

    if (!data.baseStats) {

        throw new Error(
            "Les caractéristiques de base sont absentes."
        );
    }

    for (const stat of Object.keys(STAT_DEFINITIONS)) {

        if (
            !Number.isFinite(
                Number(data.baseStats[stat])
            )
        ) {

            throw new Error(
                `La caractéristique ${stat} est invalide.`
            );
        }
    }
}


function normalizeImportedCharacter(data) {

    const fresh =
        createInitialCharacter();

    fresh.version =
        data.version || 1;

    fresh.baseStats = {
        ...fresh.baseStats,
        ...data.baseStats
    };

    fresh.stats = {
        ...fresh.stats,
        ...data.stats
    };

    fresh.age =
        Number(data.age) || 20;

    fresh.agePenalties = {
        ...fresh.agePenalties,
        ...(data.agePenalties || {})
    };

    fresh.educationRollUsed =
        Boolean(data.educationRollUsed);

    fresh.educationRoll =
        data.educationRoll || null;

    fresh.luck =
        data.luck || null;

    fresh.luckRollUsed =
        Boolean(data.luckRollUsed);

    fresh.occupationId =
        data.occupationId || "";

    fresh.skillAllocations =
        data.skillAllocations || {};

    fresh.profile = {
        ...fresh.profile,
        ...(data.profile || {})
    };

    fresh.equipment =
        Array.isArray(data.equipment)
            ? data.equipment
            : blankEquipment();

    fresh.created =
        Boolean(data.created ?? true);

    /*
        Sécurité importante :
        on supprime toute attribution professionnelle
        aux compétences qui ne sont pas celles du métier
        actuel.
    */

    Object.entries(
        fresh.skillAllocations
    ).forEach(([id, allocation]) => {

        if (!isProfessionalSkillImported(
            id,
            fresh.occupationId
        )) {

            allocation.professional = 0;
        }

        allocation.personal =
            Math.max(
                0,
                Number(allocation.personal || 0)
            );

        allocation.professional =
            Math.max(
                0,
                Number(allocation.professional || 0)
            );
    });

    return fresh;
}


function isProfessionalSkillImported(
    id,
    occupationId
) {

    const job =
        jobs.find(
            j => j.id === occupationId
        );

    return Boolean(
        job &&
        Array.isArray(job.skills) &&
        job.skills.includes(id)
    );
}

                            </div>

            </div>

                    <span>Finale</span>

                    <span>⅕</span>

function printCharacter() {

    if (!character.created) {

        alert(
            "Créez ou chargez d'abord un personnage."
        );

        return;
    }

    saveProfileFromScreen();

    renderPrintSheet();

    setTimeout(() => {
        window.print();
    }, 100);
}


/* =====================================================
   ÉCHAPPEMENT HTML
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {

    return escapeHtml(value);
}
